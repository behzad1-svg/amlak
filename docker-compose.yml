version: '3.8'

services:
  app:
    build: .
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://saj_user:saj_password_123@db:5432/saj_crm
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: saj_user
      POSTGRES_PASSWORD: saj_password_123
      POSTGRES_DB: saj_crm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saj_user -d saj_crm"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
