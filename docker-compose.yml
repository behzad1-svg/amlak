services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saj_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-saj_crm_db}
    # Production: do NOT publish 5432 — app-only network. Dev may map it.
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saj_user} -d ${POSTGRES_DB:-saj_crm_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
